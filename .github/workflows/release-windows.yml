name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify version and release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases' }
          if ($releases -contains $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_TAG already exists; refusing to replace its assets"
          }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test provider models and discovery
        run: npm test
      - name: Check TypeScript
        run: npm exec tsc -- -b
      - name: Build Windows x64 NSIS installer
        run: npm run dist:win -- --x64 --publish never
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)"
          }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish Windows-only release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -Filter '*-setup.exe' -File
          $assets = @($installer.FullName, (Resolve-Path release/SHA256SUMS.txt).Path)
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "GameCreator Prime $env:RELEASE_TAG" --generate-notes --notes "Windows x64 installer only. Install Blender 4.2+ separately and configure your model provider in Providers. This installer is unsigned."
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
