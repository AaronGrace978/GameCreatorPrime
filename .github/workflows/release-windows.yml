name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify version and release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version $version"
          }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases' }
          if ($releases -contains $env:RELEASE_TAG) {
            throw "Release $env:RELEASE_TAG already exists; refusing to replace its assets"
          }
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test application and asset generation contracts
        run: npm test
      - name: Test local GPU backend protocol
        run: python -m unittest discover -s services/hunyuan -p "test_*.py"
      - name: Check TypeScript
        run: npm exec tsc -- -b
      - name: Build Windows x64 NSIS installer
        run: npm run dist:win -- --x64 --publish never
      - name: Verify bundled Blender and GPU setup files
        shell: pwsh
        run: |
          $resources = 'release/win-unpacked/resources'
          @('blender/runtime/prepare_asset.py', 'services/hunyuan/server.py', 'services/hunyuan/worker.py', 'services/hunyuan/doctor.py', 'docs/asset-generation.md') | ForEach-Object {
            if (-not (Test-Path (Join-Path $resources $_))) { throw "Installer resource missing: $_" }
          }
      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) {
            throw "Expected one Windows installer, found $($installers.Count)"
          }
          $hash = (Get-FileHash $installers[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installers[0].Name)" | Set-Content release/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Publish Windows-only release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -Filter '*-setup.exe' -File
          $assets = @($installer.FullName, (Resolve-Path release/SHA256SUMS.txt).Path)
          $notes = "docs/releases/$env:RELEASE_TAG.md"
          if (-not (Test-Path $notes)) { throw "Release notes missing: $notes" }
          gh release create $env:RELEASE_TAG @assets --verify-tag --title "GameCreator Prime $env:RELEASE_TAG" --generate-notes --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
