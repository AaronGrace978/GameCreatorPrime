appId: prime.gamecreator.studio
productName: GameCreator Prime
copyright: Copyright © 2026 Aaron Grace. All rights reserved.
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: blender
    to: blender
    filter:
      - '**/*'
      - '!**/__pycache__/**'
  - from: services/hunyuan
    to: services/hunyuan
    filter:
      - '*.py'
      - '!test_*.py'
  - from: docs/asset-generation.md
    to: docs/asset-generation.md
win:
  target:
    - nsis
  artifactName: GameCreator-Prime-${version}-setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: GameCreator Prime
mac:
  target: dmg
linux:
  target: AppImage
